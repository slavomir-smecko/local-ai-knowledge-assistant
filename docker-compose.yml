services:

  frontend:
    image: nginx:alpine
    container_name: rag-frontend

    ports:
      - "${FRONTEND_PORT}:80"

    volumes:
      - ./frontend:/usr/share/nginx/html:ro

    depends_on:
      - n8n

    networks:
      - rag-network

    restart: unless-stopped


  rag-api:
    build: .

    container_name: rag-api

    ports:
      - "${API_PORT}:8000"

    environment:
      OLLAMA_HOST: ${OLLAMA_HOST}
      LLM_MODEL: ${LLM_MODEL}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      SEARCH_K: ${SEARCH_K}
      TOP_K: ${TOP_K}
      MAX_DISTANCE: ${MAX_DISTANCE}
      CHUNK_SIZE: ${CHUNK_SIZE}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP}

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ./vector_db:/app/vector_db
      - ./documents:/app/documents

    networks:
      - rag-network

    restart: unless-stopped


  n8n:
    image: n8nio/n8n

    container_name: n8n

    ports:
      - "${N8N_PORT}:5678"

    volumes:
      - /home/light/n8n_data:/home/node/.n8n

    depends_on:
      - rag-api

    networks:
      - rag-network

    restart: unless-stopped


networks:

  rag-network:
    driver: bridge
